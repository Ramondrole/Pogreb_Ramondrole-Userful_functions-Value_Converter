<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ramondrole</h1>
        <div class="selector" id="selector">
            <button class="active" data-type="info">Информация</button>
            <button data-type="temp">Температура</button>
            <button data-type="energy">Энергия</button>
            <button data-type="mass">Масса</button>
            <button data-type="area">Площадь</button>
            <button data-type="power">Мощность</button>
            <button data-type="length">Длина</button>
            <button data-type="volume">Объём</button>
            <button data-type="pressure">Давление</button>
            <button data-type="time">Время</button>
            <button data-type="speed">Скорость</button>
        </div>

        <div class="converter active" id="info">
            <div class="converter-title">║ ИНФОРМАЦИЯ ║</div>
            <div class="input-group">
                <label>Из:</label>
                <input type="number" id="infoInput" value="1" step="any">
                <select id="infoFrom">
                    <option value="bit">Бит</option>
                    <option value="byte" selected>Байт</option>
                    <option value="kb">КБ</option>
                    <option value="mb">МБ</option>
                    <option value="gb">ГБ</option>
                    <option value="tb">ТБ</option>
                </select>
            </div>
            <div class="input-group">
                <label>В:</label>
                <input type="number" id="infoOutput" readonly>
                <select id="infoTo">
                    <option value="bit">Бит</option>
                    <option value="byte">Байт</option>
                    <option value="kb" selected>КБ</option>
                    <option value="mb">МБ</option>
                    <option value="gb">ГБ</option>
                    <option value="tb">ТБ</option>
                </select>
            </div>
        </div>

        <div class="converter" id="temp">
            <div class="converter-title">║ ТЕМПЕРАТУРА ║</div>
            <div class="input-group">
                <label>Из:</label>
                <input type="number" id="tempInput" value="0" step="any">
                <select id="tempFrom">
                    <option value="c" selected>Цельсий</option>
                    <option value="f">Фаренгейт</option>
                    <option value="k">Кельвин</option>
                </select>
            </div>
            <div class="input-group">
                <label>В:</label>
                <input type="number" id="tempOutput" readonly>
                <select id="tempTo">
                    <option value="c">Цельсий</option>
                    <option value="f" selected>Фаренгейт</option>
                    <option value="k">Кельвин</option>
                </select>
            </div>
        </div>

        <div class="converter" id="energy">
            <div class="converter-title">║ ЭНЕРГИЯ ║</div>
            <div class="input-group">
                <label>Из:</label>
                <input type="number" id="energyInput" value="1" step="any">
                <select id="energyFrom">
                    <option value="j" selected>Джоуль</option>
                    <option value="cal">Калория</option>
                    <option value="wh">Вт·ч</option>
                    <option value="ev">эВ</option>
                </select>
            </div>
            <div class="input-group">
                <label>В:</label>
                <input type="number" id="energyOutput" readonly>
                <select id="energyTo">
                    <option value="j">Джоуль</option>
                    <option value="cal" selected>Калория</option>
                    <option value="wh">Вт·ч</option>
                    <option value="ev">эВ</option>
                </select>
            </div>
        </div>

        <div class="converter" id="mass">
            <div class="converter-title">║ МАССА ║</div>
            <div class="input-group">
                <label>Из:</label>
                <input type="number" id="massInput" value="1" step="any">
                <select id="massFrom">
                    <option value="kg" selected>Килограмм</option>
                    <option value="g">Грамм</option>
                    <option value="mg">Миллиграмм</option>
                    <option value="t">Тонна</option>
                    <option value="lb">Фунт</option>
                </select>
            </div>
            <div class="input-group">
                <label>В:</label>
                <input type="number" id="massOutput" readonly>
                <select id="massTo">
                    <option value="kg">Килограмм</option>
                    <option value="g" selected>Грамм</option>
                    <option value="mg">Миллиграмм</option>
                    <option value="t">Тонна</option>
                    <option value="lb">Фунт</option>
                </select>
            </div>
        </div>

        <div class="converter" id="area">
            <div class="converter-title">║ ПЛОЩАДЬ ║</div>
            <div class="input-group">
                <label>Из:</label>
                <input type="number" id="areaInput" value="1" step="any">
                <select id="areaFrom">
                    <option value="sqm" selected>м²</option>
                    <option value="sqkm">км²</option>
                    <option value="ha">Гектар</option>
                    <option value="acre">Акр</option>
                </select>
            </div>
            <div class="input-group">
                <label>В:</label>
                <input type="number" id="areaOutput" readonly>
                <select id="areaTo">
                    <option value="sqm">м²</option>
                    <option value="sqkm">км²</option>
                    <option value="ha" selected>Гектар</option>
                    <option value="acre">Акр</option>
                </select>
            </div>
        </div>

        <div class="converter" id="power">
            <div class="converter-title">║ МОЩНОСТЬ ║</div>
            <div class="input-group">
                <label>Из:</label>
                <input type="number" id="powerInput" value="1" step="any">
                <select id="powerFrom">
                    <option value="w" selected>Ватт</option>
                    <option value="kw">Киловатт</option>
                    <option value="hp">Л.с.</option>
                </select>
            </div>
            <div class="input-group">
                <label>В:</label>
                <input type="number" id="powerOutput" readonly>
                <select id="powerTo">
                    <option value="w">Ватт</option>
                    <option value="kw" selected>Киловатт</option>
                    <option value="hp">Л.с.</option>
                </select>
            </div>
        </div>

        <div class="converter" id="length">
            <div class="converter-title">║ ДЛИНА ║</div>
            <div class="input-group">
                <label>Из:</label>
                <input type="number" id="lengthInput" value="1" step="any">
                <select id="lengthFrom">
                    <option value="m" selected>Метр</option>
                    <option value="km">Километр</option>
                    <option value="cm">Сантиметр</option>
                    <option value="mm">Миллиметр</option>
                    <option value="mile">Миля</option>
                    <option value="yard">Ярд</option>
                </select>
            </div>
            <div class="input-group">
                <label>В:</label>
                <input type="number" id="lengthOutput" readonly>
                <select id="lengthTo">
                    <option value="m">Метр</option>
                    <option value="km">Километр</option>
                    <option value="cm" selected>Сантиметр</option>
                    <option value="mm">Миллиметр</option>
                    <option value="mile">Миля</option>
                    <option value="yard">Ярд</option>
                </select>
            </div>
        </div>

        <div class="converter" id="volume">
            <div class="converter-title">║ ОБЪЁМ ║</div>
            <div class="input-group">
                <label>Из:</label>
                <input type="number" id="volumeInput" value="1" step="any">
                <select id="volumeFrom">
                    <option value="l" selected>Литр</option>
                    <option value="ml">Миллилитр</option>
                    <option value="m3">м³</option>
                    <option value="gal">Галлон</option>
                </select>
            </div>
            <div class="input-group">
                <label>В:</label>
                <input type="number" id="volumeOutput" readonly>
                <select id="volumeTo">
                    <option value="l">Литр</option>
                    <option value="ml" selected>Миллилитр</option>
                    <option value="m3">м³</option>
                    <option value="gal">Галлон</option>
                </select>
            </div>
        </div>

        <div class="converter" id="pressure">
            <div class="converter-title">║ ДАВЛЕНИЕ ║</div>
            <div class="input-group">
                <label>Из:</label>
                <input type="number" id="pressureInput" value="1" step="any">
                <select id="pressureFrom">
                    <option value="pa" selected>Паскаль</option>
                    <option value="kpa">кПа</option>
                    <option value="bar">Бар</option>
                    <option value="atm">Атм</option>
                    <option value="mmhg">мм рт.ст.</option>
                </select>
            </div>
            <div class="input-group">
                <label>В:</label>
                <input type="number" id="pressureOutput" readonly>
                <select id="pressureTo">
                    <option value="pa">Паскаль</option>
                    <option value="kpa">кПа</option>
                    <option value="bar" selected>Бар</option>
                    <option value="atm">Атм</option>
                    <option value="mmhg">мм рт.ст.</option>
                </select>
            </div>
        </div>

        <div class="converter" id="time">
            <div class="converter-title">║ ВРЕМЯ ║</div>
            <div class="input-group">
                <label>Из:</label>
                <input type="number" id="timeInput" value="1" step="any">
                <select id="timeFrom">
                    <option value="s" selected>Секунда</option>
                    <option value="min">Минута</option>
                    <option value="h">Час</option>
                    <option value="d">День</option>
                </select>
            </div>
            <div class="input-group">
                <label>В:</label>
                <input type="number" id="timeOutput" readonly>
                <select id="timeTo">
                    <option value="s">Секунда</option>
                    <option value="min" selected>Минута</option>
                    <option value="h">Час</option>
                    <option value="d">День</option>
                </select>
            </div>
        </div>

        <div class="converter" id="speed">
            <div class="converter-title">║ СКОРОСТЬ ║</div>
            <div class="input-group">
                <label>Из:</label>
                <input type="number" id="speedInput" value="1" step="any">
                <select id="speedFrom">
                    <option value="ms" selected>м/с</option>
                    <option value="kmh">км/ч</option>
                    <option value="mph">миль/ч</option>
                    <option value="knot">узел</option>
                </select>
            </div>
            <div class="input-group">
                <label>В:</label>
                <input type="number" id="speedOutput" readonly>
                <select id="speedTo">
                    <option value="ms">м/с</option>
                    <option value="kmh" selected>км/ч</option>
                    <option value="mph">миль/ч</option>
                    <option value="knot">узел</option>
                </select>
            </div>
        </div>

        <div class="back-button">
            <a href="#" id="backLink">[ НАЗАД ]</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
